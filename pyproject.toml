[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bindsite"
version = "0.1.0"
description = "Structure-aware prediction of ligand-binding residues with homology-separated evaluation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "ligand binding site", "protein structure", "transformer",
    "cross-attention", "homology separation", "data leakage", "AUPRC",
]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    # >=2.3: numpy 2.2.x on Apple Silicon emits spurious "divide by zero /
    # overflow / invalid value encountered in matmul" warnings from
    # scikit-learn's logistic solver. Results are unaffected (verified: same
    # AUPRC, finite coefficients) but the warnings are noise.
    "numpy>=2.3",
    "scipy>=1.10",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "biopython>=1.81",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The transformer. CPU, CUDA and Apple MPS all work.
torch = ["torch>=2.0"]
dev = ["pytest>=7.4", "ruff>=0.4"]
all = ["torch>=2.0", "pytest>=7.4", "ruff>=0.4", "certifi"]

[project.scripts]
bindsite = "bindsite.cli:main"

[project.urls]
Repository = "https://github.com/dhaunscodehub/ligand-binding-site-transformer"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    # See the numpy note above.
    "ignore:.*encountered in matmul.*:RuntimeWarning",
    "ignore:.*sklearn.utils.parallel.delayed.*:UserWarning",
]

[tool.ruff]
line-length = 90
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
