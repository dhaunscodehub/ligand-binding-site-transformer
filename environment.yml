# Conda environment for bindsite.
#
# torch is installed via pip rather than pinned here: the right build depends
# on the host (CUDA version, or Apple MPS), and pinning one would produce an
# environment that installs but cannot use the accelerator.
name: bindsite
channels:
  - conda-forge
dependencies:
  - python=3.11
  # >=2.3 avoids spurious matmul warnings from scikit-learn's logistic solver
  # on numpy 2.2.x / Apple Silicon. See src/bindsite/models/baselines.py.
  - numpy>=2.3
  - scipy>=1.10
  - pandas>=2.0
  - scikit-learn>=1.3
  - biopython>=1.81
  - pyyaml>=6.0
  - certifi
  - pip
  - pip:
      - pytest>=7.4
      - ruff>=0.4
      # - torch>=2.0        # uncomment, or install the build matching your host
      # MMseqs2 is a separate binary, not a Python package. Install it with
      # `conda install -c bioconda mmseqs2` for datasets beyond a few thousand
      # sequences; the built-in exact clustering covers smaller ones.
